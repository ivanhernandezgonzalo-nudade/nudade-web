name: fetch-render
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vivienda-arenys-de-mar
      - run: |
          curl -fsSL -o render.png "https://d8j0ntlcm91z4.cloudfront.net/user_3JmKDO1KTdFHJRBzP8xgSOzg83b/hf_20261026_152038_623e17c8-054d-4fe1-91a8-7f5e0b803317.png"
          mkdir -p tmp-render && mv render.png tmp-render/render.png
          git config user.name "Iván Hernández"
          git config user.email "342954019+ivanhernandezgonzalo-nudade@users.noreply.github.com"
          git add tmp-render/render.png
          git commit -m "tmp: render salón"
          git push origin HEAD:vivienda-arenys-de-mar
